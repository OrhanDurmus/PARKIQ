<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ROTAPARK · Hesabım</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081320;color:#eaf2ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:35px auto;padding:22px}.panel{background:#122238;border:1px solid #29405b;border-radius:18px;padding:23px}h1{margin:0 0 12px}p{color:#b4c5d9;line-height:1.5}input,button{width:100%;padding:14px;border-radius:10px;margin:7px 0;font:inherit}input{background:#071524;color:white;border:1px solid #536780}button{border:0;background:#4ed3b4;color:#08202b;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#233a55;color:white}a{color:#7ccfff}#status{min-height:25px;color:#ffcf7b}#signed{display:none}</style></head><body><main><p><a href="/">← ROTAPARK'a dön</a></p><div class="panel"><h1>Hesabım</h1><p>E-posta doğrulama koduyla veya Google ve Apple hesabınla giriş yap.</p><p id="status" role="status">Bağlantı kontrol ediliyor…</p><div id="login"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" placeholder="ornek@eposta.com"><button id="send">Doğrulama kodu gönder</button><label for="otp">E-postana gelen kod</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="6 haneli kod"><button id="verify" class="alt">Kodu doğrula</button><hr><button id="google" class="alt">Google ile devam et</button><button id="apple" class="alt">Apple ile devam et</button></div><div id="signed"><p id="profile"></p><button id="logout" class="alt">Çıkış yap</button></div></div></main><script type="module">
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;let client;
try{
 const config=await fetch('/api/auth-config',{cache:'no-store'}).then(r=>r.json());
 if(!config.configured)throw Error('Giriş sistemi henüz yapılandırılmadı. Supabase bağlantısı gerekiyor.');
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
 client=createClient(config.url,config.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});
 const show=async()=>{const {data:{user}}=await client.auth.getUser();$('login').style.display=user?'none':'block';$('signed').style.display=user?'block':'none';$('profile').textContent=user?'Giriş yapıldı: '+(user.email||'Hesap'):'';say(user?'Hesabın doğrulandı.':'Giriş yapabilirsin.')};
 await show();client.auth.onAuthStateChange(()=>{setTimeout(show,0)});
 $('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('E-posta adresini gir.');say('Kod gönderiliyor…');const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});say(error?'Kod gönderilemedi: '+error.message:'E-postana gönderilen kodu gir.')};
 $('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('otp').value.trim();if(!email||!token)return say('E-posta ve doğrulama kodunu gir.');const {error}=await client.auth.verifyOtp({email,token,type:'email'});if(error)say('Doğrulama başarısız: '+error.message);else await show()};
 const oauth=async provider=>{say('Yönlendiriliyor…');const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/account/'}});if(error)say(provider+' girişi başarısız: '+error.message)};
 $('google').onclick=()=>oauth('google');$('apple').onclick=()=>oauth('apple');
 $('logout').onclick=async()=>{await client.auth.signOut();await show()};
}catch(e){say(e.message);for(const id of ['send','verify','google','apple'])$(id).disabled=true}
</script></body></html>
