<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ROTAPARK · Hesabım</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081320;color:#eaf2ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:35px auto;padding:22px}.panel{background:#122238;border:1px solid #29405b;border-radius:18px;padding:23px}h1{margin:0 0 12px}p{color:#b4c5d9;line-height:1.5}input,button{width:100%;padding:14px;border-radius:10px;margin:7px 0;font:inherit}input{background:#071524;color:white;border:1px solid #536780}button{border:0;background:#4ed3b4;color:#08202b;font-weight:700;cursor:pointer}button:disabled{opacity:.5}button.alt{background:#233a55;color:white}a{color:#7ccfff}#status{min-height:25px;color:#ffcf7b}#signed{display:none}.history-item{padding:13px 0;border-top:1px solid #30435a;overflow-wrap:anywhere}.history-item small{display:block;color:#a9bdd2;margin:6px 0}.history-item button{width:auto;padding:9px 13px;font-size:14px;background:#ed6471;color:white}</style></head><body><main><p><a href="/">← ROTAPARK'a dön</a></p><div class="panel"><h1>Hesabım</h1><p>E-posta doğrulama koduyla veya Google ve Apple hesabınla giriş yap.</p><p id="status" role="status">Bağlantı kontrol ediliyor…</p><div id="login"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" placeholder="ornek@eposta.com"><button id="send">Doğrulama kodu gönder</button><label for="otp">E-postana gelen kod</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="6 haneli kod"><button id="verify" class="alt">Kodu doğrula</button><hr><button id="google" class="alt">Google ile devam et</button><button id="apple" class="alt">Apple ile devam et</button></div><div id="signed"><p id="profile"></p><h2>Bildirimlerim</h2><p>Son 90 gündeki park yeri bildirimlerin.</p><button id="refresh-reports" class="alt">Bildirimlerimi yenile</button><div id="my-reports" aria-live="polite"></div><button id="logout" class="alt">Çıkış yap</button></div></div></main><script type="module">
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;let client;
try{
 const config=await fetch('/api/auth-config',{cache:'no-store'}).then(r=>r.json());
 if(!config.configured)throw Error('Giriş sistemi henüz yapılandırılmadı. Supabase bağlantısı gerekiyor.');
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
 client=createClient(config.url,config.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});
 const loadReports=async()=>{
 const box=$('my-reports');box.replaceChildren();box.textContent='Bildirimler yükleniyor…';
 try{
  const {data:{session}}=await client.auth.getSession();if(!session?.access_token){box.textContent='Giriş yapman gerekiyor.';return}
  const res=await fetch('/api/my-reports',{headers:{Authorization:'Bearer '+session.access_token},cache:'no-store'}),data=await res.json();
  if(!res.ok||!data.ok)throw Error(data.error||'HTTP '+res.status);
  box.replaceChildren();
  if(!data.items.length){box.textContent='Henüz bildirim geçmişin yok.';return}
  const labels={active:'Aktif',expired:'Süresi doldu',owner_deleted:'Kullanıcı tarafından iptal edildi',admin_deleted:'Yönetici kaldırdı'};
  for(const item of data.items){
   const div=document.createElement('div');div.className='history-item';
   const title=document.createElement('strong');title.textContent=labels[item.status]||'Bildirim';
   const details=document.createElement('small');details.textContent=new Date(item.createdAt).toLocaleString('tr-TR')+' · '+(item.address||('GPS: '+Number(item.lat).toFixed(5)+', '+Number(item.lng).toFixed(5)));
   div.append(title,details);
   if(item.status==='active'){
    const btn=document.createElement('button');btn.textContent='Bildirimimi sil';
    btn.onclick=async()=>{if(!confirm('Bu bildirimi silmek istiyor musun?'))return;btn.disabled=true;try{
     const {data:{session:current}}=await client.auth.getSession();
     const response=await fetch('/api/community-parking',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+current.access_token},body:JSON.stringify({id:item.id})});
     const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'Silinemedi');
     await loadReports();
    }catch(e){alert('Silinemedi: '+e.message);btn.disabled=false}};
    div.append(btn);
   }
   box.append(div);
  }
  if(data.partial){const p=document.createElement('p');p.textContent='İlk 200 kayıt gösteriliyor.';box.append(p)}
 }catch(e){box.textContent='Bildirimler yüklenemedi: '+e.message}
};
 const show=async()=>{const {data:{user}}=await client.auth.getUser();$('login').style.display=user?'none':'block';$('signed').style.display=user?'block':'none';$('profile').textContent=user?'Giriş yapıldı: '+(user.email||'Hesap'):'';say(user?'Hesabın doğrulandı.':'Giriş yapabilirsin.');if(user)await loadReports();else $('my-reports').replaceChildren()};
 const callback=new URL(location.href);if(callback.searchParams.has('code')){say('Giriş bağlantısı doğrulanıyor…');const {error}=await client.auth.exchangeCodeForSession(callback.searchParams.get('code'));if(error)say('Giriş bağlantısı doğrulanamadı: '+error.message);else history.replaceState({},'',location.pathname)}
 await show();client.auth.onAuthStateChange(()=>{setTimeout(show,0)});
 $('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('E-posta adresini gir.');say('Kod gönderiliyor…');const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/account/'}});say(error?'Kod gönderilemedi: '+error.message:'E-postanı kontrol et. Gelen 6 haneli kodu gir veya giriş bağlantısına dokun.')};
 $('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('otp').value.trim();if(!email||!token)return say('E-posta ve doğrulama kodunu gir.');const {error}=await client.auth.verifyOtp({email,token,type:'email'});if(error)say('Doğrulama başarısız: '+error.message);else await show()};
 const oauth=async provider=>{say('Yönlendiriliyor…');const {error}=await client.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/account/'}});if(error)say(provider+' girişi başarısız: '+error.message)};
 $('google').onclick=()=>oauth('google');$('apple').onclick=()=>oauth('apple');
 $('refresh-reports').onclick=loadReports;
 $('logout').onclick=async()=>{await client.auth.signOut();await show()};
}catch(e){say(e.message);for(const id of ['send','verify','google','apple'])$(id).disabled=true}
</script></body></html>
