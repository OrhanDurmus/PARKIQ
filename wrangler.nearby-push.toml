name = "rotapark-nearby-push-worker"
main = "workers/nearby-push-worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

[[queues.consumers]]
queue = "rotapark-nearby-push"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "rotapark-nearby-push-dlq"

[[queues.producers]]
binding = "NEARBY_PUSH_QUEUE"
queue = "rotapark-nearby-push"

[[d1_databases]]
binding = "DB"
database_name = "parkiq-db"
database_id = "76b60c11-371a-4c46-b826-187a01d611d1"

# Configure WEB_PUSH_PUBLIC_KEY, WEB_PUSH_PRIVATE_KEY and
# WEB_PUSH_CONTACT_EMAIL in the Worker dashboard.
# Use the same VAPID key pair as the ROTAPARK Pages project.
