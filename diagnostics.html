<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091421"><title>ROTAPARK Servis Kontrolü</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;background:#091421;color:#eef7ff;margin:0;padding:20px;max-width:680px;margin-inline:auto}h1{font-size:25px}p{line-height:1.5;color:#b6c8d9}button,a{display:inline-block;border:0;border-radius:12px;padding:13px 17px;font:inherit;font-weight:700;background:#50d9b7;color:#072521;text-decoration:none}button:disabled{opacity:.55}a{background:#223c51;color:#eef7ff;margin-left:6px}article{background:#15293b;border:1px solid #2c465b;border-radius:14px;margin-top:14px;padding:15px}article h2{font-size:17px;margin:0 0 8px}article p{margin:0}small{color:#b6c8d9}code{overflow-wrap:anywhere} .ok{color:#69e3b9}.bad{color:#ff9d91}.warn{color:#f7d18b}</style></head>
<body><h1>🅿️ ROTAPARK Servis Kontrolü</h1><p>Bu ekran canlı sitede açıldığında aynı alan adındaki otopark servislerini test eder. Test, gerçek park yeri doluluk bilgisini doğrulamaz.</p><button id="run">Servisleri test et</button><a href="/">Uygulamaya dön</a><p id="summary" role="status" aria-live="polite">Test başlatılmadı.</p><div id="results"></div>
<script>
const run=document.getElementById('run'),results=document.getElementById('results'),summary=document.getElementById('summary');
const tests=[{name:'OSM otopark API',url:'/api/parking?lat=40.879&lng=29.23',check:d=>Array.isArray(d?.points),count:d=>d.points.length},{name:'İşletme otopark API',url:'/api/business-parking?lat=40.879&lng=29.23',check:d=>Array.isArray(d?.points),count:d=>d.points.length},{name:'Sürüm bilgisi',url:'/version.json',check:d=>typeof d?.version==='string'&&!!d.version,count:d=>'Sürüm: '+d.version}];
async function test(t){const start=performance.now(),controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(t.url,{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});const duration=Math.round(performance.now()-start);const contentType=response.headers.get('content-type')||'';if(!response.ok)throw Error('HTTP '+response.status);if(!contentType.includes('json'))throw Error('JSON yerine '+(contentType||'belirsiz içerik')+' döndü');const data=await response.json();if(!t.check(data))throw Error('Beklenen JSON alanları bulunamadı');return {ok:true,message:'HTTP '+response.status+' · '+duration+' ms · '+(typeof t.count(data)==='number'?t.count(data)+' kayıt':t.count(data))}}catch(e){return {ok:false,message:(e.name==='AbortError'?'12 saniye zaman aşımı':e.message)+' · '+Math.round(performance.now()-start)+' ms'}}finally{clearTimeout(timeout)}}
run.onclick=async()=>{run.disabled=true;results.replaceChildren();summary.textContent='3 servis test ediliyor…';const values=await Promise.all(tests.map(test));let successes=0;values.forEach((v,i)=>{if(v.ok)successes++;const article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),small=document.createElement('small');h.textContent=(v.ok?'✓ ':'✕ ')+tests[i].name;p.className=v.ok?'ok':'bad';p.textContent=v.message;small.textContent=tests[i].url;article.append(h,p,small);results.appendChild(article)});summary.textContent=successes+'/3 servis başarılı. '+(successes===3?'Yanıt biçimleri doğrulandı; uygulama akışının ayrıca test edilmesi gerekir.':'Başarısız servisler için Cloudflare dağıtımı ve API yapılandırmasını kontrol edin.');run.disabled=false};
</script></body></html>
