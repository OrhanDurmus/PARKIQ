<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Destek Arşivi · ROTAPARK Admin</title><style>*{box-sizing:border-box}body{background:#091727;color:#e6f2ff;margin:0;font:15px system-ui,-apple-system,sans-serif}header{padding:calc(18px + env(safe-area-inset-top)) 16px 18px;background:#13283e;border-bottom:1px solid #304b64}header a{color:#8ee4d1;text-decoration:none}main{max-width:850px;margin:auto;padding:22px 16px}h1{font-size:24px}.muted{color:#adc0d4;line-height:1.5}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}input{flex:1;min-width:180px;padding:13px;background:#13283d;border:1px solid #3b5670;border-radius:12px;color:#fff;font:inherit}button{background:#315775;border:1px solid #54728b;border-radius:11px;color:#fff;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer}.ticket{border:1px solid #304c64;border-radius:14px;margin:10px 0;background:#13283d;overflow:hidden}.ticket summary{padding:16px;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center}.ticket summary::-webkit-details-marker{display:none}.ticket summary .info{flex:1;min-width:0}.ticket summary strong{display:block;overflow-wrap:anywhere}.ticket summary small{display:block;color:#a8bfd2;margin-top:5px}.tag{background:#24544e;color:#7cf1d2;border-radius:20px;padding:5px 9px;font-size:11px}.body{border-top:1px solid #304c64;padding:16px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}.body p{margin:0 0 16px}.body button{background:#3d596c}.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0}@media(max-width:430px){.tag{font-size:10px}.ticket summary{padding:13px}}</style></head><body><header><a href="/admin/">← Yönetim paneline dön</a></header><main><h1>🗂️ Destek talebi arşivi</h1><p class="muted">Yanıtlanan ve kapatılan talepler burada saklanır. Kayıtlar tek satır halinde listelenir; ayrıntıları görmek için bir talebe dokunun.</p><div class="toolbar"><input id="q" type="search" placeholder="Konu, e-posta, mesaj ara" aria-label="Arşivde ara"><button id="refresh">↻ Yenile</button></div><p class="muted" id="status" role="status">Yükleniyor…</p><div id="items"></div><div class="pages"><button id="prev">← Önceki</button><span id="page"></span><button id="next">Sonraki →</button></div></main><script>(function(){let records=[],page=0;const size=10;const $=id=>document.getElementById(id);function render(){const q=$('q').value.trim().toLocaleLowerCase('tr'),list=records.filter(({item})=>[item.topic,item.email,item.message,item.admin_reply].join(' ').toLocaleLowerCase('tr').includes(q));const pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages-1);$('items').replaceChildren();for(const {item,type} of list.slice(page*size,(page+1)*size)){const details=document.createElement('details');details.className='ticket';const summary=document.createElement('summary');const info=document.createElement('span');info.className='info';const name=document.createElement('strong');name.textContent=(type==='contact'?(item.topic||'Destek talebi'):'Hesap itirazı')+' · '+(item.email||'E-posta belirtilmedi');const date=document.createElement('small');date.textContent=new Date(item.created_at).toLocaleString('tr-TR');info.append(name,date);const tag=document.createElement('span');tag.className='tag';tag.textContent=item.status==='closed'?'Kapatıldı':'Yanıtlandı';summary.append(info,tag);const body=document.createElement('div');body.className='body';const msg=document.createElement('p');msg.textContent='Talep: '+item.message;const reply=document.createElement('p');reply.textContent='Yönetici yanıtı: '+(item.admin_reply||'Yanıt yok');const restore=document.createElement('button');restore.textContent='↩ Yeniden aç';restore.onclick=async()=>{restore.disabled=true;try{const r=await fetch('/admin/api/'+(type==='contact'?'contact-support':'blocked-support'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,status:'open'})});if(!r.ok)throw Error();await load()}catch{alert('Talep açılamadı');restore.disabled=false}};body.append(msg,reply,restore);details.append(summary,body);$('items').append(details)}$('status').textContent=list.length+' kayıt · Sayfa başına '+size+' talep';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}async function load(){try{const [c,a]=await Promise.all([fetch('/admin/api/contact-support',{cache:'no-store'}),fetch('/admin/api/blocked-support',{cache:'no-store'})]);if(!c.ok||!a.ok)throw Error();const [cd,ad]=await Promise.all([c.json(),a.json()]);if(!cd.ok||!ad.ok)throw Error();records=[...(cd.items||[]).map(item=>({item,type:'contact'})),...(ad.items||[]).map(item=>({item,type:'blocked'}))].filter(({item})=>Boolean(item.admin_reply)||item.status==='closed').sort((a,b)=>new Date(b.item.created_at)-new Date(a.item.created_at));render()}catch{$('status').textContent='Arşiv yüklenemedi. Yönetici oturumunu kontrol edin.'}}$('q').oninput=()=>{page=0;render()};$('refresh').onclick=load;$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{page++;render();scrollTo(0,0)};load()})();</script></body></html>
