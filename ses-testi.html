<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARKIQ Ses Testi</title><style>body{background:#091421;color:#eff7ff;font:17px system-ui;padding:28px;max-width:560px;margin:auto}button{background:#4ee0bc;color:#091421;border:0;border-radius:14px;padding:17px;font-weight:700;font-size:17px;width:100%;margin:12px 0}p{line-height:1.6}#status{background:#18283b;padding:16px;border-radius:12px;white-space:pre-wrap}audio{width:100%;margin-top:15px}</style></head><body><h1>PARKIQ Ses Testi</h1><p>Bu sayfa haritayı ve navigasyonu değiştirmez. Azure Türkçe kadın sesini ayrı test eder.</p><label for="style">Konuşma tarzı</label><select id="style" style="display:block;width:100%;padding:14px;margin:12px 0;border-radius:12px;background:#18283b;color:white;font-size:16px"><option value="calm">Sakin ve doğal</option><option value="clear">Net navigasyon</option><option value="normal">Standart Azure</option></select><button id="test">🔊 Seçilen sesi dinle</button><p id="status">Test için butona dokun.</p><audio id="player" controls playsinline></audio><script>const btn=document.getElementById('test'),status=document.getElementById('status'),player=document.getElementById('player');let url=null;btn.onclick=async()=>{btn.disabled=true;status.textContent='Azure ses dosyası isteniyor…';try{const response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Navigasyon başladı. İki yüz metre düz devam edin, ardından sağa dönün.',style:document.getElementById('style').value})});if(!response.ok){let msg='HTTP '+response.status;try{const d=await response.json();msg=d.error||msg}catch{}throw Error(msg)}const blob=await response.blob();if(!blob.size)throw Error('Boş ses dosyası');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);player.src=url;status.textContent='Ses hazır ('+Math.round(blob.size/1024)+' KB). Otomatik oynatma deneniyor…';try{await player.play();status.textContent='▶ Ses oynatılıyor. Duyamıyorsan telefonun ses seviyesini kontrol et.'}catch(e){status.textContent='Ses dosyası hazır fakat Safari otomatik oynatmayı engelledi. Aşağıdaki oynat düğmesine dokun. ('+e.name+')'}}catch(e){status.textContent='⚠️ Ses servisi hatası: '+e.message}finally{btn.disabled=false}};</script></body></html>
