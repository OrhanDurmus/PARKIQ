<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROTAPARK • Yetki Ayarları</title><style>body{background:#090909;color:#f4f0e7;font:16px system-ui;margin:0}main{max-width:720px;margin:25px auto;padding:16px}section{background:#171512;border:1px solid #6c562a;border-radius:15px;padding:20px;box-shadow:0 10px 35px #0007}h1{color:#e9c77e}a{color:#e9c77e}a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e9c77e;outline-offset:3px}label{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #4b3e29}select,button{font:inherit;padding:10px;background:#24201a;color:#f4f0e7;border:1px solid #927646;border-radius:8px}input{accent-color:#d6ac59}button{background:#84682e}button:disabled{opacity:.5}.muted{color:#c5bbab}</style></head><body><main><p><a href="/staff/">← Yönetim Merkezi</a></p><section><h1>👑 Yetki Ayarları</h1><p id="status" role="status">Kurucu yetkisi doğrulanıyor…</p><div id="panel" hidden><label>Yetki grubu <select id="role"><option value="moderator">Moderatör</option><option value="admin">Yönetici</option></select></label><div id="permissions"></div><p class="muted">Değişiklikler yalnızca kurucu tarafından kaydedilir. Henüz bu izinleri kullanan yönetim API'leri etkinleştirilmedi.</p></div><section id="auditSection" hidden aria-labelledby="auditTitle"><h2 id="auditTitle">İşlem Geçmişi</h2><p id="auditStatus" class="muted" role="status">Geçmiş yükleniyor…</p><ol id="auditEntries"></ol><button type="button" id="refreshAudit">Geçmişi yenile</button></section></section></main><script type="module">(async()=>{const $=id=>document.getElementById(id);const labels={'parking_reports.read':'Park bildirimlerini görüntüle','parking_reports.moderate':'Park bildirimlerini yönet','support.read':'Destek taleplerini görüntüle','support.reply':'Destek taleplerini yanıtla','users.block':'Kullanıcı engelle','announcements.publish':'Toplu duyuru yayınla','staff.moderators.manage':'Moderatör ata','parking_records.edit':'Otopark bilgilerini düzenle'};try{const cfg=await fetch('/api/auth-config',{cache:'no-store'}).then(r=>r.json());if(!cfg.configured)throw Error('Giriş ayarları bulunamadı.');const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');const sb=createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:false}});const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError||!session?.access_token)throw Error('Giriş yapmalısın.');const {data:{user},error:userError}=await sb.auth.getUser();if(userError||!user||user.id!==session.user.id)throw Error('Oturum doğrulanamadı. Yeniden giriş yapın.');const {data:role,error:roleError}=await sb.rpc('rotapark_my_role');if(roleError||role!=='founder')throw Error('Bu ayarları yalnızca kurucu değiştirebilir.');let rows=[];let saving=false;async function loadAudit(){const status=$('auditStatus');const list=$('auditEntries');status.textContent='Geçmiş yükleniyor…';list.replaceChildren();try{const r=await sb.rpc('rotapark_founder_get_permission_audit',{p_limit:30});if(r.error)throw Error(r.error.message);for(const entry of r.data||[]){const item=document.createElement('li');const label=labels[entry.permission_key]||entry.permission_key;const time=new Date(entry.created_at).toLocaleString('tr-TR');item.textContent=time+' — '+(entry.target_role==='admin'?'Yönetici':entry.target_role==='moderator'?'Moderatör':'Diğer')+' / '+label+': '+(entry.previous_enabled===null?'İlk kayıt':entry.previous_enabled?'Açıktı':'Kapalıydı')+' → '+(entry.new_enabled?'Açık':'Kapalı');list.append(item)}status.textContent=(r.data||[]).length?'Son '+r.data.length+' işlem gösteriliyor.':'Henüz kayıtlı işlem yok.';}catch(e){status.textContent='İşlem geçmişi yüklenemedi: '+(e.message||'Bağlantı hatası')}}$('refreshAudit').addEventListener('click',loadAudit);const lockControls=locked=>{saving=locked;$('role').disabled=locked;for(const box of $('permissions').querySelectorAll('input[type="checkbox"]'))box.disabled=locked};async function reload(){const r=await sb.rpc('rotapark_founder_get_role_permissions');if(r.error)throw Error('Yetki tabloları henüz kurulmamış olabilir: '+r.error.message);rows=r.data||[];render()}function render(){const role=$('role').value;const list=$('permissions');list.replaceChildren();for(const [key,label] of Object.entries(labels)){const row=document.createElement('label');const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='checkbox';input.disabled=saving;input.checked=rows.find(x=>x.staff_role===role&&x.permission_key===key)?.enabled===true;input.setAttribute('aria-label',label);input.addEventListener('change',async()=>{if(saving)return;lockControls(true);const desired=input.checked;try{const result=await sb.rpc('rotapark_founder_set_role_permission',{p_role:role,p_permission:key,p_enabled:desired});if(result.error)throw Error(result.error.message);await reload();$('status').textContent='Yetki kaydedildi ve doğrulandı.';await loadAudit();}catch(e){$('status').textContent='Yetki durumu doğrulanamadı: '+(e.message||'Bağlantı hatası')+'. Güvenlik için ayarlar kapatıldı; sayfayı yenileyin.';$('panel').hidden=true;}finally{lockControls(false)}});row.append(name,input);list.append(row)}}$('role').addEventListener('change',render);await reload();$('panel').hidden=false;$('auditSection').hidden=false;await loadAudit();$('status').textContent='Kurucu doğrulandı. Yetki ayarları hazır.';}catch(e){$('status').textContent=e.message||'Yetki doğrulanamadı.'}})();</script></body></html>
