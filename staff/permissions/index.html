<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROTAPARK • Yetki Ayarları</title><style>body{background:#111d2a;color:#eaf2f9;font:16px system-ui;margin:0}main{max-width:720px;margin:25px auto;padding:16px}section{background:#1b3041;border:1px solid #486477;border-radius:15px;padding:20px}h1{color:#efcb7c}a{color:#efcb7c}label{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #355064}select,button{font:inherit;padding:10px;background:#263f51;color:white;border:1px solid #71889b;border-radius:8px}button{background:#84682e}button:disabled{opacity:.5}.muted{color:#bbcad7}</style></head><body><main><p><a href="/staff/">← Yönetim Merkezi</a></p><section><h1>👑 Yetki Ayarları</h1><p id="status" role="status">Kurucu yetkisi doğrulanıyor…</p><div id="panel" hidden><label>Yetki grubu <select id="role"><option value="moderator">Moderatör</option><option value="admin">Yönetici</option></select></label><div id="permissions"></div><p class="muted">Değişiklikler yalnızca kurucu tarafından kaydedilir. Henüz bu izinleri kullanan yönetim API'leri etkinleştirilmedi.</p></div></section></main><script type="module">(async()=>{const $=id=>document.getElementById(id);const labels={'parking_reports.read':'Park bildirimlerini görüntüle','parking_reports.moderate':'Park bildirimlerini yönet','support.read':'Destek taleplerini görüntüle','support.reply':'Destek taleplerini yanıtla','users.block':'Kullanıcı engelle','announcements.publish':'Toplu duyuru yayınla','staff.moderators.manage':'Moderatör ata','parking_records.edit':'Otopark bilgilerini düzenle'};try{const cfg=await fetch('/api/auth-config',{cache:'no-store'}).then(r=>r.json());if(!cfg.configured)throw Error('Giriş ayarları bulunamadı.');const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');const sb=createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',detectSessionInUrl:false}});const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Giriş yapmalısın.');const {data:role,error:roleError}=await sb.rpc('rotapark_my_role');if(roleError||role!=='founder')throw Error('Bu ayarları yalnızca kurucu değiştirebilir.');let rows=[];let saving=false;const lockControls=locked=>{saving=locked;$('role').disabled=locked;for(const box of $('permissions').querySelectorAll('input[type="checkbox"]'))box.disabled=locked};async function reload(){const r=await sb.rpc('rotapark_founder_get_role_permissions');if(r.error)throw Error('Yetki tabloları henüz kurulmamış olabilir: '+r.error.message);rows=r.data||[];render()}function render(){const role=$('role').value;const list=$('permissions');list.replaceChildren();for(const [key,label] of Object.entries(labels)){const row=document.createElement('label');const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='checkbox';input.checked=rows.find(x=>x.staff_role===role&&x.permission_key===key)?.enabled===true;input.setAttribute('aria-label',label);input.addEventListener('change',async()=>{if(saving)return;lockControls(true);const desired=input.checked;try{const result=await sb.rpc('rotapark_founder_set_role_permission',{p_role:role,p_permission:key,p_enabled:desired});if(result.error)throw Error(result.error.message);await reload();$('status').textContent='Yetki kaydedildi ve doğrulandı.';}catch(e){$('status').textContent='Yetki durumu doğrulanamadı: '+(e.message||'Bağlantı hatası')+'. Güvenlik için ayarlar kapatıldı; sayfayı yenileyin.';$('panel').hidden=true;}finally{lockControls(false)}});row.append(name,input);list.append(row)}}$('role').addEventListener('change',render);await reload();$('panel').hidden=false;$('status').textContent='Kurucu doğrulandı. Yetki ayarları hazır.';}catch(e){$('status').textContent=e.message||'Yetki doğrulanamadı.'}})();</script></body></html>
