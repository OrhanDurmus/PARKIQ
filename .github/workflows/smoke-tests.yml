name: ROTAPARK smoke tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staff permission gate (fail-closed)
        run: node --test tests/staff-permissions-gate.test.mjs tests/staff-capability.test.mjs tests/staff-parking-reports.test.mjs tests/staff-tasks.test.mjs
      - name: Verify staging D1 migrations (isolated SQLite)
        run: node --test tests/staging-d1-migrations.test.mjs
      - name: Verify staging member unblock SQL contract (static checks)
        run: node --test tests/staging-member-unblock-contract.test.mjs tests/staging-member-unblock-ui.test.mjs tests/staging-member-unblock-preflight.test.mjs
      - name: Validate staff center and permission pages
        run: node scripts/check-staff-pages.cjs
      - name: Validate parking API and app startup syntax
        run: node --test tests/parking-api.test.mjs tests/business-parking.test.mjs tests/ispark-occupancy.test.mjs tests/app-smoke.test.mjs
  regression:
    name: Full Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Node test files
        run: node --test --experimental-test-isolation=none tests/*.test.mjs
