name: JavaScript syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline and external JavaScript
        run: node scripts/check-js-syntax.cjs
