name: ROTAPARK automated ISPARK snapshots
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ispark-snapshot-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and upload ISPARK snapshot
        env:
          ISPARK_UPLOAD_TOKEN: ${{ secrets.ISPARK_UPLOAD_TOKEN }}
        run: python scripts/collect_ispark_snapshot.py
