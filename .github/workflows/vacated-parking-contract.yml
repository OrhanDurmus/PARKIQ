name: Vacated parking report contract
on:
  pull_request:
    paths:
      - 'functions/api/community-parking.js'
      - 'tests/vacated-parking-contract.mjs'
      - '.github/workflows/vacated-parking-contract.yml'
  push:
    paths:
      - 'functions/api/community-parking.js'
      - 'tests/vacated-parking-contract.mjs'
      - '.github/workflows/vacated-parking-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/vacated-parking-contract.mjs
