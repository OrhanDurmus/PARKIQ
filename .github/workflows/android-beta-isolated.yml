name: ROTAPARK isolated Android beta APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'scripts/prepare-beta-capacitor.cjs'
      - '.github/workflows/android-beta-isolated.yml'
permissions:
  contents: read
jobs:
  android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled assets
        run: npm run mobile:prepare
      - name: Generate isolated beta configuration
        run: |
          node scripts/prepare-beta-capacitor.cjs --check
          node scripts/prepare-beta-capacitor.cjs
          cp build/beta/capacitor.config.json capacitor.config.json
          node -e "const c=require('./capacitor.config.json'); if(c.appId!=='tr.com.rotapark.app.beta'||c.server.url!=='https://beta.rotapark.com.tr'||c.server.cleartext!==false||JSON.stringify(c.server.allowNavigation)!=='[\"beta.rotapark.com.tr\"]')process.exit(1)"
      - name: Generate Android project for beta only
        run: npx cap add android
      - name: Confirm generated Android config targets beta
        run: |
          test -f android/app/src/main/assets/capacitor.config.json
          node -e "const c=require('./android/app/src/main/assets/capacitor.config.json');if(c.appId!=='tr.com.rotapark.app.beta'||c.server.url!=='https://beta.rotapark.com.tr')process.exit(1)"
      - name: Build test-only beta debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload beta-only APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotapark-beta-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
