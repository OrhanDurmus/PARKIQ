name: ROTAPARK Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/prepare-mobile.cjs'
      - '.github/workflows/rotapark-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest ROTAPARK source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK preinstalled on GitHub runner
        run: |
          test -d "$ANDROID_HOME" || { echo 'Android SDK missing'; exit 1; }
          echo "Android SDK found at $ANDROID_HOME"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Verify fixed production URL (never build preview link APK)
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          if(c.server?.url!=='https://rotapark.com.tr') {
            throw Error('Unexpected APK origin: '+String(c.server?.url));
          }
          if(c.appId!=='tr.com.rotapark.app') throw Error('Unexpected app ID');
          console.log('Verified APK URL: '+c.server.url);
          NODE
      - name: Stage web assets
        run: npm run mobile:prepare
      - name: Create Android project
        run: npx cap add android
      - name: Synchronize Android Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable ROTAPARK APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTAPARK-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
