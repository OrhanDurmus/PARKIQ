name: ROTAPARK Mapbox SDK staging compile
on:
  workflow_dispatch:
  push:
    branches:
      - feature/staging-mapbox-navigation-20261123
    paths:
      - '.github/workflows/mapbox-navigation-staging.yml'
      - 'scripts/native/apply-mapbox-navigation-staging.cjs'
      - 'scripts/native/android/RotaparkNativeMapActivity.java'
      - 'scripts/native/audit-mapbox-staging.cjs'
      - 'scripts/native/check-mapbox-render.py'
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/feature/staging-mapbox-navigation-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [map, navigation-compile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Validate installer
        run: node --check scripts/native/apply-mapbox-navigation-staging.cjs
      - name: Audit isolated Mapbox staging wiring
        run: node scripts/native/audit-mapbox-staging.cjs
      - run: npm run mobile:prepare
      - name: Use local staging web assets
        run: node scripts/native/prepare-local-navigation-staging.cjs
      - run: npx cap add android
      - name: Configure Mapbox staging dependencies
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: node scripts/native/apply-mapbox-navigation-staging.cjs
      - name: Audit generated Android SDK isolation
        run: node scripts/native/audit-mapbox-staging.cjs --generated-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build staging APK and record resolved dependencies
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          STAGING_VARIANT: ${{ matrix.variant }}
        working-directory: android
        shell: bash
        run: |
          mkdir -p ../mapbox-render
          gradle_args=()
          if [[ "$STAGING_VARIANT" == "navigation-compile" ]]; then
            gradle_args+=("-ProtaparkNavigationSmoke")
          fi
          for attempt in 1 2 3; do
            if ./gradlew "${gradle_args[@]}" --console=plain :app:assembleDebug :app:dependencies --configuration debugRuntimeClasspath > /tmp/mapbox-gradle.log 2>&1; then
              cat /tmp/mapbox-gradle.log
              cp /tmp/mapbox-gradle.log ../mapbox-render/gradle-dependencies.log
              break
            fi
            cat /tmp/mapbox-gradle.log
            if [[ "$attempt" == 3 ]] || ! grep -Eq '(HTTP[^0-9]*|status code )429' /tmp/mapbox-gradle.log; then
              exit 1
            fi
            sleep "$((attempt * 45))"
          done
      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'map' && 'rotapark-mapbox-staging-apk' || 'rotapark-mapbox-staging-sdk-smoke-apk' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
      - name: Check Mapbox style and tile access
        if: matrix.variant == 'map'
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: |
          for resource in \
              styles/v1/mapbox/satellite-streets-v12 \
              styles/v1/mapbox/streets-v12 \
              v4/mapbox.satellite/12/2377/1535.jpg90 \
              v4/mapbox.mapbox-streets-v8/12/2377/1535.vector.pbf; do
            status="$(curl --silent --max-time 20 --get --data-urlencode "access_token=$MAPBOX_PUBLIC_TOKEN" \
              --output /dev/null --write-out '%{http_code}' "https://api.mapbox.com/$resource")" || true
            printf '%s HTTP %s\n' "$resource" "$status"
          done | tee mapbox-render/mapbox-http-status.txt
      - uses: actions/setup-python@v5
        if: matrix.variant == 'map'
        with:
          python-version: '3.12'
      - name: Install image analysis dependency
        if: matrix.variant == 'map'
        run: python -m pip install Pillow==11.3.0
      - name: Enable emulator acceleration
        if: matrix.variant == 'map'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native Mapbox pixels on Android
        if: matrix.variant == 'map'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim
          script: adb shell wm size 800x1340 && adb shell wm density 240 && adb install android/app/build/outputs/apk/debug/app-debug.apk && python scripts/native/check-mapbox-render.py mapbox-render
      - name: Upload Mapbox rendering evidence
        if: always() && matrix.variant == 'map'
        uses: actions/upload-artifact@v4
        with:
          name: rotapark-mapbox-render-evidence
          path: mapbox-render/
          retention-days: 7
      - name: Upload Navigation compile evidence
        if: always() && matrix.variant == 'navigation-compile'
        uses: actions/upload-artifact@v4
        with:
          name: rotapark-mapbox-navigation-dependencies
          path: mapbox-render/gradle-dependencies.log
          retention-days: 7
