name: ROTAPARK Mapbox SDK staging compile
on:
  workflow_dispatch:
  push:
    branches:
      - feature/staging-mapbox-navigation-20261123
    paths:
      - '.github/workflows/mapbox-navigation-staging.yml'
      - 'scripts/native/apply-mapbox-navigation-staging.cjs'
      - 'scripts/native/android/RotaparkNativeMapActivity.java'
      - 'scripts/native/audit-mapbox-staging.cjs'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm install --no-audit --no-fund
      - name: Validate installer
        run: node --check scripts/native/apply-mapbox-navigation-staging.cjs
      - name: Audit isolated Mapbox staging wiring
        run: node scripts/native/audit-mapbox-staging.cjs
      - run: npm run mobile:prepare
      - name: Use local staging web assets
        run: node scripts/native/prepare-local-navigation-staging.cjs
      - run: npx cap add android
      - name: Configure Mapbox staging dependencies
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: node scripts/native/apply-mapbox-navigation-staging.cjs
      - name: Audit generated Android SDK isolation
        run: node scripts/native/audit-mapbox-staging.cjs --generated-android
      - name: Build staging APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          cd android
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts"
              exit 1
            fi
            echo "Gradle failed; retrying after transient repository rate-limit window..."
            sleep $((attempt * 45))
          done
      - name: Upload APK for dependency smoke test
        uses: actions/upload-artifact@v4
        with:
          name: rotapark-mapbox-staging-sdk-smoke-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
