name: Android APK (test)
on:
  workflow_dispatch:
  push:
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-mobile.cjs'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure Preview-only test target
        env:
          ROTAPARK_PREVIEW_URL: https://release-rotapark-first-publi.parkiq.pages.dev
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.ROTAPARK_PREVIEW_URL);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.parkiq.pages.dev')) {
            throw new Error('Android test must use Preview');
          }
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          config.server = { url: url.origin, cleartext: false, allowNavigation: [url.hostname] };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2) + '\n');
          console.log('Preview target:', url.origin);
          NODE
      - name: Prepare web and Android
        run: |
          npm run mobile:prepare
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ROTAPARK-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
