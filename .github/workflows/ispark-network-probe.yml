name: İSPARK external network probe
on:
  pull_request:
    paths:
      - '.github/workflows/ispark-network-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public İBB API from GitHub runner
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          url = "https://api.ibb.gov.tr/ispark/Park"
          start = time.monotonic()
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"ROTAPARK-diagnostic/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  payload = res.read(2000000)
                  data = json.loads(payload)
                  rows = data if isinstance(data,list) else data.get("data",data.get("parks",[])) if isinstance(data,dict) else []
                  print(json.dumps({"reachable":True,"httpStatus":res.status,"rowCount":len(rows),"elapsedSeconds":round(time.monotonic()-start,2)},ensure_ascii=False))
          except Exception as error:
              print(json.dumps({"reachable":False,"errorType":type(error).__name__,"httpStatus":getattr(error,"code",None),"elapsedSeconds":round(time.monotonic()-start,2)},ensure_ascii=False))
              raise SystemExit(1)
          PY
