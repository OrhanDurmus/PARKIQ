name: ROTAPARK Android debug build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || { echo 'Android SDK platforms directory missing'; exit 1; }
          ls "$ANDROID_HOME/platforms"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web assets
        run: npm run mobile:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Configure native location permissions
        run: node scripts/configure-native-permissions.cjs
      - name: Verify Android foreground location permissions
        run: |
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Compile debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: rotapark-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
