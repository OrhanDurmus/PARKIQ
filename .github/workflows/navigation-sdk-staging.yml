name: ROTAPARK SDK staging installer
on:
  pull_request:
    paths:
      - 'scripts/native/**'
      - '.github/workflows/navigation-sdk-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Validate SDK installer JavaScript syntax
        run: node --check scripts/native/apply-navigation-sdk-staging.cjs
      - run: npm run mobile:prepare
      - name: Use local web assets in isolated staging Android test build
        run: |
          node scripts/native/prepare-local-navigation-staging.cjs
          node -e "const c=require('./capacitor.config.json');if(c.server)process.exit(1)"
          grep -q 'requestedNativeTarget' www/index.html
      - run: npx cap add android
      - name: Install staging Navigation SDK
        run: node scripts/native/apply-navigation-sdk-staging.cjs
      - name: Check installer is repeatable
        run: node scripts/native/apply-navigation-sdk-staging.cjs
      - name: Assert SDK is disabled without a staging key
        run: |
          if grep -q 'rotapark.navigation.sdk.enabled' android/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected SDK activation in keyless build' >&2
            exit 1
          fi
          if grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected Google Maps key in keyless build' >&2
            exit 1
          fi
      - name: Reject malformed staging key without leaking it
        run: |
          if ROTAPARK_STAGING_GOOGLE_MAPS_API_KEY=invalid node scripts/native/apply-navigation-sdk-staging.cjs; then
            echo 'Invalid key was unexpectedly accepted' >&2
            exit 1
          fi
          if grep -q 'rotapark.navigation.sdk.enabled' android/app/src/main/AndroidManifest.xml; then
            echo 'Invalid key unexpectedly enabled SDK' >&2
            exit 1
          fi
      - name: Compile Android SDK probe
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Verify staging-only key opt-in without publishing credentials
        env:
          ROTAPARK_STAGING_GOOGLE_MAPS_API_KEY: 'TEST_KEY_NOT_VALID_FOR_NAVIGATION_123456'
        run: |
          node scripts/native/apply-navigation-sdk-staging.cjs
          grep -q 'rotapark.navigation.sdk.enabled' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml
      - name: Reject stale credential reuse in keyless builds
        run: |
          if node scripts/native/apply-navigation-sdk-staging.cjs; then
            echo 'Keyless rerun incorrectly accepted previously configured credentials' >&2
            exit 1
          fi
