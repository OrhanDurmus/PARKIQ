name: ROTAPARK Navigation SDK compatibility probe
on:
  pull_request:
    paths:
      - 'scripts/native/android/**'
      - '.github/workflows/navigation-sdk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:prepare
      - run: npx cap add android
      - name: Inspect generated Android toolchain
        run: |
          cat android/variables.gradle
          cat android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties
          ls "$ANDROID_HOME/platforms"
      - name: Compile preparation bridge without SDK or credentials
        run: |
          cp scripts/native/android/RotaparkNavigationPlugin.java android/app/src/main/java/tr/com/rotapark/app/
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Compile actual Google Navigation SDK dependency (no credentials)
        run: |
          sed -i 's/com.android.tools.build:gradle:8.7.2/com.android.tools.build:gradle:8.13.2/' android/build.gradle
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.13-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/minSdkVersion = 23/minSdkVersion = 24/;s/(compileSdkVersion|targetSdkVersion) = 35/\1 = 36/' android/variables.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }
          dependencies {
              implementation 'com.google.android.libraries.navigation:navigation:7.9.0'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
          }
          EOF
          cd android
          ./gradlew assembleDebug --no-daemon
