name: ROTAPARK Navigation SDK compatibility probe
on:
  pull_request:
    paths:
      - 'scripts/native/android/**'
      - '.github/workflows/navigation-sdk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:prepare
      - run: npx cap add android
      - name: Inspect generated Android toolchain
        run: |
          cat android/variables.gradle
          cat android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties
          ls "$ANDROID_HOME/platforms"
      - name: Compile registered Google Navigation SDK bridge (no credentials)
        run: |
          node scripts/native/apply-navigation-sdk-staging.cjs
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --info
      - name: Report disk and Android package diagnostics on failure
        if: failure()
        run: |
          df -h
          du -sh android/app/build android/.gradle ~/.gradle/caches 2>/dev/null || true
          find android/app/build/outputs -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
