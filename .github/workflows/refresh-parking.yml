name: Refresh Istanbul parking dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: parking-dataset-refresh
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parking API geographic safeguards
        run: node --test tests/parking-api.test.mjs
      - run: pip install osmium
      - name: Download official regional extract
        run: curl -fL --retry 3 --connect-timeout 30 -o /tmp/turkey.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
      - name: Extract parking records
        run: |
          mkdir -p data
          python scripts/import_parking.py /tmp/turkey.osm.pbf data/parking.json /tmp/entrance-review.json
      - name: Extract nationwide parking records
        run: python scripts/import_national_parking.py /tmp/turkey.osm.pbf data/parking-turkiye.json
      - name: Validate nationwide dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/parking-turkiye.json',encoding='utf-8'))
          assert len(d['points'])>=100
          assert len({(p['osmType'],p['osmId']) for p in d['points']})==len(d['points'])
          assert all(35.5<=p['lat']<=42.5 and 25.5<=p['lng']<=45 for p in d['points'])
          print('Nationwide parking records:',len(d['points']))
          PY
      - name: Summarize parking and entrance candidates
        run: |
          python - <<'PY'
          import json, os
          with open('data/parking.json', encoding='utf-8') as f:
              data=json.load(f)
          with open('/tmp/entrance-review.json', encoding='utf-8') as f:
              review=json.load(f)
          total=len(data.get('points', []))
          parking=data['points']
          assert all(p.get('osmType') in ('node','way') and str(p.get('osmId','')).isdigit() for p in parking), 'Missing OSM identity'
          assert len({(p['osmType'],p['osmId']) for p in parking})==len(parking), 'Duplicate OSM identity'

          candidates=review.get('candidates', [])
          assert review.get('status')=='REVIEW_REQUIRED'
          assert review.get('candidateCount')==len(candidates)
          assert all(c.get('entranceVerified') is False for c in candidates)
          unique=review.get('uniqueEntrances', [])
          assert review.get('uniqueEntranceCount')==len(unique), 'Unique count mismatch'
          assert review.get('duplicateMatchCount')==len(candidates)-len(unique), 'Duplicate count mismatch'
          assert len({str(e['osmId']) for e in unique})==len(unique), 'Duplicate OSM IDs'
          assert all(e.get('entranceVerified') is False for e in unique), 'Unexpected verified entrance'
          assert all(-90<=e['lat']<=90 and -180<=e['lng']<=180 for e in unique), 'Invalid coordinates'
          assert all(c.get('distanceMeters',1000)<=80.1 for c in candidates), 'Candidate too far'
          ambiguous=review.get('ambiguousParking', [])
          assert review.get('ambiguousParkingCount')==len(ambiguous)
          assert all(x['candidateCount']==len(x['entranceOptions']) and x['candidateCount']>1 for x in ambiguous)
          assert all(x['entranceVerified'] is False for x in ambiguous)
          geographic=review.get('geographicReview', [])
          assert review.get('geographicReviewCount')==len(geographic)
          assert all(x['reviewRequired'] is True and x['reasons'] for x in geographic)
          summary=(
              "## Istanbul parking dataset refresh\n\n"
              f"- Parking records: **{total}**\n"
              f"- Unverified entrance candidates: **{len(candidates)}**\n"
              f"- Unique OSM entrance nodes: **{len(unique)}**\n"
              f"- Duplicate entrance matches: **{review['duplicateMatchCount']}**\n"
              f"- Unnamed parking matches: **{review['unnamedParkingMatchCount']}**\n"
              f"- Parking lots with multiple possible entrances: **{len(ambiguous)}**\n"
              "- Candidate coordinates require independent review before navigation.\n"
              "- Download the `istanbul-entrance-candidates-review` artifact from this workflow run.\n"
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(summary)
          PY
      - name: Export mobile-friendly entrance review CSV
        run: |
          python - <<'PY'
          import csv, json
          with open('/tmp/entrance-review.json',encoding='utf-8') as f:
              report=json.load(f)
          with open('/tmp/entrance-review.csv','w',encoding='utf-8-sig',newline='') as f:
              writer=csv.writer(f)
              writer.writerow(['OSM entrance ID','Entrance latitude','Entrance longitude','Matched parking count','Parking names','Review priority','Needs disambiguation','OSM source','Map location','Verified'])
              for e in report['uniqueEntrances']:
                  writer.writerow([e['osmId'],e['lat'],e['lng'],e['matchedParkingCount'],
                                   '; '.join(e['namedParkingMatches']),e['reviewPriority'],
                                   e['needsDisambiguation'],e['osmUrl'],e['mapUrl'],'NO'])
          with open('/tmp/ambiguous-entrances.csv','w',encoding='utf-8-sig',newline='') as f:
              writer=csv.writer(f)
              writer.writerow(['Parking name','Parking latitude','Parking longitude','Candidate count','OSM entrance ID','Entrance latitude','Entrance longitude','Distance meters','OSM source','Verified'])
              for parking in report.get('ambiguousParking',[]):
                  for e in parking['entranceOptions']:
                      writer.writerow([parking['parkingName'],parking['parkingLat'],parking['parkingLng'],
                                       parking['candidateCount'],e['osmId'],e['lat'],e['lng'],e['distanceMeters'],e['osmUrl'],'NO'])
          with open('/tmp/geographic-review.csv','w',encoding='utf-8-sig',newline='') as f:
              writer=csv.writer(f)
              writer.writerow(['Parking name','Latitude','Longitude','City','Province','Review reasons','Needs review'])
              for p in report.get('geographicReview',[]):
                  writer.writerow([p['parkingName'],p['lat'],p['lng'],p['city'],p['province'],
                                   '; '.join(p['reasons']),'YES'])
          PY
      - name: Validate exported review CSV
        run: |
          python - <<'PY'
          import csv, json
          with open('/tmp/entrance-review.json',encoding='utf-8') as f:
              review=json.load(f)
          with open('/tmp/entrance-review.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==review['uniqueEntranceCount'], 'CSV unique count mismatch'
          assert len({r['OSM entrance ID'] for r in rows})==len(rows), 'Duplicate CSV entrance ID'
          assert all(r['Verified']=='NO' for r in rows), 'Unreviewed entrance marked verified'
          assert all(r['OSM source'].startswith('https://www.openstreetmap.org/node/') for r in rows)
          assert all(r['Map location'].startswith('https://www.openstreetmap.org/?mlat=') for r in rows)
          with open('/tmp/ambiguous-entrances.csv',encoding='utf-8-sig',newline='') as f:
              ambiguous_rows=list(csv.DictReader(f))
          assert len(ambiguous_rows)==sum(p['candidateCount'] for p in review.get('ambiguousParking',[]))
          assert all(r['Verified']=='NO' for r in ambiguous_rows)
          assert all(0<=float(r['Distance meters'])<=80.1 for r in ambiguous_rows)
          assert all(r['OSM source'].startswith('https://www.openstreetmap.org/node/') for r in ambiguous_rows)
          with open('/tmp/geographic-review.csv',encoding='utf-8-sig',newline='') as f:
              geographic_rows=list(csv.DictReader(f))
          assert len(geographic_rows)==review.get('geographicReviewCount',0)
          assert all(r['Needs review']=='YES' for r in geographic_rows)
          print('CSV review validation passed:',len(rows),'unique entrances')
          PY
      - name: Test geographic boundary classifier
        run: python -m unittest discover -s scripts -p 'test_istanbul_boundary.py' -v
      - name: Review Istanbul administrative boundary (non-destructive)
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/wri/cities_data_misc/main/Deep%20Dive%20boundaries/boundary-TUR-Istanbul-districtsADM6.geojson' \
            -o /tmp/istanbul-districts.geojson
          python scripts/review_istanbul_boundary.py data/parking.json /tmp/istanbul-districts.geojson /tmp/istanbul-boundary-review.csv
      - name: Validate boundary review exports
        run: |
          python - <<'PY'
          import csv, pathlib
          base=pathlib.Path('/tmp')
          full=base/'istanbul-boundary-review.csv'
          if not full.exists():
              print('Boundary review unavailable; no exclusions performed.')
              raise SystemExit(0)
          def read(name):
              with (base/name).open(encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          all_rows=read('istanbul-boundary-review.csv')
          flagged=read('istanbul-boundary-flagged.csv')
          bands=read('istanbul-boundary-distance-bands.csv')
          assert len(all_rows)>0
          assert len(flagged)==sum(r['Review required']=='YES' for r in all_rows)
          assert all(r['Review required']=='YES' and r['Review category']!='inside' for r in flagged)
          assert sum(int(r['Review candidates']) for r in bands)==len(flagged)
          assert len(all_rows)==len(flagged)+sum(r['Review category']=='inside' for r in all_rows)
          assert all(float(r['Approx boundary distance (m)'])>=0 for r in all_rows)
          print('Boundary CSV checks passed:',len(all_rows),'total,',len(flagged),'flagged')
          PY
      - name: Record boundary review availability
        if: always()
        run: |
          python - <<'PY'
          import csv,os
          path='/tmp/istanbul-boundary-review.csv'
          if os.path.isfile(path):
              with open(path,encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              flagged=sum(r['Review required']=='YES' for r in rows)
              categories={}
              for row in rows:
                  cat=row['Review category']
                  categories[cat]=categories.get(cat,0)+1
              print('Boundary categories:',categories)
              message=f"- Boundary review: **completed**, {flagged} flagged of {len(rows)} parking records.\n"
          else:
              message="- Boundary review: **unavailable** (source download or validation failed). No geographic exclusion was applied.\n"
              with open('/tmp/istanbul-boundary-review-status.txt','w',encoding='utf-8') as f:
                  f.write('UNAVAILABLE: boundary source download or validation failed; no parking records were excluded.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(message)
          PY
      - name: Upload entrance candidate review report
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-entrance-candidates-review
          path: |
            /tmp/entrance-review.json
            /tmp/entrance-review.csv
            /tmp/ambiguous-entrances.csv
            /tmp/geographic-review.csv
            /tmp/istanbul-boundary-review.csv
            /tmp/istanbul-boundary-flagged.csv
            /tmp/istanbul-boundary-regions.csv
            /tmp/istanbul-boundary-distance-bands.csv
            /tmp/istanbul-boundary-audit.json
            /tmp/istanbul-boundary-region-summary.csv
            /tmp/istanbul-boundary-review-status.txt
          retention-days: 30
      - name: Guard against incomplete parking dataset
        run: |
          python - <<'PY'
          import json, pathlib
          new=json.loads(pathlib.Path('data/parking.json').read_text(encoding='utf-8'))
          old_text=__import__('subprocess').run(
              ['git','show','HEAD:data/parking.json'],capture_output=True,text=True)
          if old_text.returncode==0:
              old=json.loads(old_text.stdout)
              previous=len(old.get('points',[]))
              current=len(new.get('points',[]))
              if previous>=100 and current<previous*0.5:
                  raise SystemExit(f'Refusing drastic parking dataset drop: {previous} -> {current}')
              print(f'Dataset size guard passed: {previous} -> {current}')
          else:
              print('No previous dataset to compare; first import allowed')
          PY
      - name: Commit refreshed OSM records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/parking.json data/parking-turkiye.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Türkiye OSM parking datasets"
            # Other workflow runs or PR merges may advance main during the download.
            # Replay only the generated dataset commit on the latest main; never force-push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Parking dataset published successfully."
                exit 0
              fi
              echo "Concurrent update detected; retrying ($attempt/5)..."
              sleep 5
            done
            echo "::error::Could not publish dataset after five retries."
            exit 1
          fi
