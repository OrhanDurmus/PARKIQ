name: Preview auth-config regression
on:
  pull_request:
    paths:
      - 'functions/api/auth-config.js'
      - 'tests/auth-config.test.mjs'
      - '.github/workflows/preview-auth-config-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/auth-config.test.mjs
