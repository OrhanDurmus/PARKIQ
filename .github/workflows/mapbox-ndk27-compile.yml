name: Mapbox NDK 27 staging compile
on:
  push:
    branches: [feature/staging-mapbox-navigation-20261123]
    paths: ['.github/workflows/mapbox-ndk27-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    if: github.ref == 'refs/heads/feature/staging-mapbox-navigation-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable Capacitor project
        run: |
          npm install --no-audit --no-fund
          npm run mobile:prepare
          npx --no-install cap add android
      - name: Configure NDK 27 compile check
        working-directory: android/app
        run: |
          cat >> build.gradle <<'GRADLE'

          repositories {
              maven {
                  url = uri('https://api.mapbox.com/downloads/v2/releases/maven')
                  content { includeGroupByRegex('com[.]mapbox([.].*)?') }
                  if (System.getenv('MAPBOX_DOWNLOADS_TOKEN')) {
                      credentials {
                          username = 'mapbox'
                          password = System.getenv('MAPBOX_DOWNLOADS_TOKEN')
                      }
                      authentication { basic(org.gradle.authentication.http.BasicAuthentication) }
                  }
              }
          }
          dependencies {
              debugImplementation('com.mapbox.maps:android-ndk27:11.35.2') { version { strictly('11.35.2') } }
              debugImplementation('com.mapbox.navigationcore:android-ndk27:3.35.2') { version { strictly('3.35.2') } }
          }
          GRADLE
          mkdir -p src/debug/java/probe
          cat > src/debug/java/probe/SdkTypes.java <<'JAVA'
          package probe;
          import com.mapbox.maps.MapView;
          import com.mapbox.navigation.core.MapboxNavigation;
          import com.getcapacitor.BridgeActivity;
          final class SdkTypes {
              MapView view;
              MapboxNavigation navigation;
              BridgeActivity bridge;
          }
          JAVA
      - name: Compile debug Java
        working-directory: android
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac
          test -n "$(find app/build -name SdkTypes.class -print -quit)"
          test -z "$(find app/build -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
