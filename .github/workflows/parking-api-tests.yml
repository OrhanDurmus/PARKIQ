name: ROTAPARK API safety tests
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/parking.js'
      - 'tests/parking-api.test.mjs'
      - '.github/workflows/parking-api-tests.yml'
  pull_request:
    paths:
      - 'functions/api/parking.js'
      - 'tests/parking-api.test.mjs'
      - '.github/workflows/parking-api-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parking API geographic safety
        run: node --test tests/parking-api.test.mjs
