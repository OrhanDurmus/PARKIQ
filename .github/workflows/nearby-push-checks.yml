name: Nearby Web Push checks
on:
  pull_request:
    paths:
      - 'functions/api/community-parking.js'
      - 'functions/api/nearby-push.js'
      - 'functions/lib/**'
      - 'src/nearby-push-*.js'
      - 'sw.js'
      - 'tests/nearby-push.test.mjs'
      - '.github/workflows/nearby-push-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          for f in functions/api/community-parking.js functions/api/nearby-push.js functions/lib/nearby-push-*.js functions/lib/web-push.js src/nearby-push-*.js sw.js; do node --check "$f"; done
      - name: Run nearby push regression tests
        run: node --test tests/nearby-push.test.mjs
