<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARKIQ İşletmeci</title><style>body{background:#091421;color:#fff;font:16px system-ui;margin:0}main{max-width:620px;margin:auto;padding:20px}section{background:#192c40;padding:20px;border-radius:15px;margin:15px 0}input{width:95%;padding:12px;background:#263c52;color:white;border:1px solid #678;border-radius:9px;font:inherit;margin:10px 0}button{background:#50d9b7;color:#102c25;border:0;border-radius:9px;padding:12px;font-weight:bold}a{color:#50d9b7}#message{color:#70e3c5}#historyBars{display:flex;gap:5px;align-items:end;min-height:130px;overflow-x:auto;padding:12px 2px;border-bottom:1px solid #527088}#historyBars div{flex:1;min-width:8px;max-width:25px;background:#50d9b7;border-radius:5px 5px 0 0}#historyEmpty{color:#a9c4d7;font-size:13px}</style></head><body><main><a href="/">← PARKIQ</a><h1>İşletmeci Paneli</h1><p>Yönetici tarafından verilen özel erişim anahtarınızla giriş yapın. Anahtar cihazda saklanmaz.</p><section><label>Erişim anahtarı<input id="token" type="password" autocomplete="off"></label><button id="login">Giriş yap</button><button id="logout">Çıkış</button></section><section id="panel" hidden><h2 id="name"></h2><label>Toplam araç kapasitesi<input id="capacity" type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="Örn. 100"></label><p id="updated"></p><label>Boş park yeri sayısı<input id="free" type="number" min="0" step="1" inputmode="numeric"></label><label><input id="allDay" type="checkbox" style="width:auto"> 24 saat açık</label><label>Açılış saati<input id="opens" type="time" value="08:00"></label><label>Kapanış saati<input id="closes" type="time" value="22:00"></label><h3>💳 Otopark fiyatları (isteğe bağlı)</h3><label>Saatlik fiyat (TL)<input id="hourlyPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal" placeholder="Belirtilmedi"></label><label>Günlük fiyat (TL)<input id="dailyPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal" placeholder="Belirtilmedi"></label><button id="save">Kapasite ve boş yer sayısını güncelle</button><h3>📊 Son 7 gün doluluk geçmişi</h3><p id="historyEmpty">Henüz geçmiş bildirim yok.</p><div id="historyBars" role="img" aria-label="Son 7 gün doluluk bildirimi grafiği"></div><p id="historyStats"></p><p>Son bildirim 30 dakikadan eskiyse sürücülere güncel bilgi olarak gösterilmez.</p></section><p id="message" role="status"></p></main><script>(function(){const $=id=>document.getElementById(id);let key='';function renderHistory(history){const root=$('historyBars');root.replaceChildren();const items=(history||[]).slice().reverse();$('historyEmpty').hidden=items.length>0;if(!items.length){$('historyStats').textContent='';return}let sum=0,count=0;for(const p of items){const cap=Number(p.capacity),free=Number(p.free_spaces);if(!Number.isFinite(cap)||cap<=0||!Number.isFinite(free))continue;const percent=Math.max(0,Math.min(100,Math.round((cap-free)*100/cap)));sum+=percent;count++;const bar=document.createElement('div');bar.style.height=Math.max(3,percent)+'px';bar.title=p.recorded_at+' · Doluluk %'+percent;root.appendChild(bar)}$('historyStats').textContent=count?'Son 7 gün: '+count+' bildirim · Ortalama bildirilen doluluk %'+Math.round(sum/count):'Grafik için kapasite ve boş yer bildirimi gerekli'}async function api(method,data){const r=await fetch('/api/business-occupancy',{method,headers:{Authorization:'Bearer '+key,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Hata');return j}$('login').onclick=async()=>{key=$('token').value.trim();try{const d=await api('GET');$('name').textContent=d.business.name;$('capacity').value=d.business.capacity||'';$('updated').textContent='Son güncelleme: '+(d.business.updated_at||'Yok');$('free').value=d.business.free_spaces??'';$('allDay').checked=d.business.is_24h===1;$('opens').value=d.business.opens_at||'08:00';$('closes').value=d.business.closes_at||'22:00';$('hourlyPrice').value=d.business.hourly_price??'';$('dailyPrice').value=d.business.daily_price??'';renderHistory(d.history);$('panel').hidden=false;$('message').textContent='Giriş başarılı'}catch(e){$('panel').hidden=true;$('message').textContent=e.message}};$('save').onclick=async()=>{const n=Number($('free').value);if($('free').value===''||!Number.isSafeInteger(n)||n<0){$('message').textContent='Geçerli sayı girin';return}try{const capacity=Number($('capacity').value);if($('capacity').value.trim()===''||!Number.isSafeInteger(capacity)||capacity<1||capacity>100000||n>capacity){$('message').textContent='Kapasite 1-100000 arasında olmalı ve boş yer sayısından küçük olamaz';return}const d=await api('POST',{freeSpaces:n,capacity,hours:{is24h:$('allDay').checked,opensAt:$('opens').value,closesAt:$('closes').value},pricing:{hourlyPrice:$('hourlyPrice').value,dailyPrice:$('dailyPrice').value}});$('message').textContent='Kaydedildi: '+d.freeSpaces;$('updated').textContent='Az önce güncellendi';const refreshed=await api('GET');renderHistory(refreshed.history)}catch(e){$('message').textContent=e.message}};$('logout').onclick=()=>{key='';$('token').value='';$('panel').hidden=true;renderHistory([]);$('message').textContent='Çıkış yapıldı'}})();</script></body></html>
