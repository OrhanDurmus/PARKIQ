<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARKIQ İşletmeci</title><style>body{background:#091421;color:#fff;font:16px system-ui;margin:0}main{max-width:620px;margin:auto;padding:20px}section{background:#192c40;padding:20px;border-radius:15px;margin:15px 0}input{width:95%;padding:12px;background:#263c52;color:white;border:1px solid #678;border-radius:9px;font:inherit;margin:10px 0}button{background:#50d9b7;color:#102c25;border:0;border-radius:9px;padding:12px;font-weight:bold}a{color:#50d9b7}#message{color:#70e3c5}</style></head><body><main><a href="/">← PARKIQ</a><h1>İşletmeci Paneli</h1><p>Yönetici tarafından verilen özel erişim anahtarınızla giriş yapın. Anahtar cihazda saklanmaz.</p><section><label>Erişim anahtarı<input id="token" type="password" autocomplete="off"></label><button id="login">Giriş yap</button><button id="logout">Çıkış</button></section><section id="panel" hidden><h2 id="name"></h2><label>Toplam araç kapasitesi<input id="capacity" type="number" min="1" max="100000" step="1" inputmode="numeric" placeholder="Örn. 100"></label><p id="updated"></p><label>Boş park yeri sayısı<input id="free" type="number" min="0" step="1" inputmode="numeric"></label><button id="save">Kapasite ve boş yer sayısını güncelle</button><p>Son bildirim 30 dakikadan eskiyse sürücülere güncel bilgi olarak gösterilmez.</p></section><p id="message" role="status"></p></main><script>(function(){const $=id=>document.getElementById(id);let key='';async function api(method,data){const r=await fetch('/api/business-occupancy',{method,headers:{Authorization:'Bearer '+key,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Hata');return j}$('login').onclick=async()=>{key=$('token').value.trim();try{const d=await api('GET');$('name').textContent=d.business.name;$('capacity').value=d.business.capacity||'';$('updated').textContent='Son güncelleme: '+(d.business.updated_at||'Yok');$('free').value=d.business.free_spaces??'';$('panel').hidden=false;$('message').textContent='Giriş başarılı'}catch(e){$('panel').hidden=true;$('message').textContent=e.message}};$('save').onclick=async()=>{const n=Number($('free').value);if($('free').value===''||!Number.isSafeInteger(n)||n<0){$('message').textContent='Geçerli sayı girin';return}try{const capacity=Number($('capacity').value);if($('capacity').value.trim()===''||!Number.isSafeInteger(capacity)||capacity<1||capacity>100000||n>capacity){$('message').textContent='Kapasite 1-100000 arasında olmalı ve boş yer sayısından küçük olamaz';return}const d=await api('POST',{freeSpaces:n,capacity});$('message').textContent='Kaydedildi: '+d.freeSpaces;$('updated').textContent='Az önce güncellendi'}catch(e){$('message').textContent=e.message}};$('logout').onclick=()=>{key='';$('token').value='';$('panel').hidden=true;$('message').textContent='Çıkış yapıldı'}})();</script></body></html>
