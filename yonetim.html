<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PARKIQ | Yönetim</title><style>*{box-sizing:border-box}body{background:#091421;color:#f0f7ff;font:15px system-ui,-apple-system,sans-serif;margin:0}main{max-width:780px;margin:auto;padding:20px 15px 60px}h1{font-size:26px}a{color:#5be4c1}.card{background:#15293e;border:1px solid #34536b;padding:16px;border-radius:14px;margin:13px 0}input,select{background:#203a53;color:white;border:1px solid #45657d;border-radius:9px;padding:12px;font:inherit;max-width:100%}input{width:100%}button{border:0;border-radius:9px;background:#55dab9;color:#09241e;padding:11px;font:inherit;font-weight:700;margin:7px 7px 0 0;cursor:pointer}.secondary{background:#314a63;color:white}.danger{background:#853a46;color:white}p,small{color:#afc4d7}#msg{min-height:22px;color:#7fe8c8}.field{padding:4px 0;overflow-wrap:anywhere}.field b{color:#fff}select{width:100%}</style></head><body><main><a href="/">← PARKIQ</a><h1>🛡️ PARKIQ Yönetici Paneli</h1><p>Bu ekran yalnızca yetkili yönetici içindir. Giriş anahtarı bu cihazda saklanmaz.</p><section class="card"><label for="token">Yönetici erişim anahtarı (ADMIN_TOKEN)</label><input id="token" type="password" autocomplete="off" placeholder="Cloudflare'da tanımladığınız gizli anahtar"><div><button id="load">Başvuruları getir</button><button id="logout" class="secondary">Anahtarı temizle</button></div><p id="msg" role="status"></p></section><section class="card"><label for="filter">Durum filtresi</label><select id="filter"><option value="">Tüm başvurular</option><option value="pending">Bekleyen</option><option value="approved">Onaylanan</option><option value="rejected">Reddedilen</option></select><div id="applications"><p>Başvuruları görüntülemek için anahtar girin.</p></div></section></main><script>(function(){const $=id=>document.getElementById(id);const labels={pending:'Bekliyor',approved:'Onaylandı',rejected:'Reddedildi'};let token='';const field=(label,value)=>{const div=document.createElement('div');div.className='field';const b=document.createElement('b');b.textContent=label+': ';div.append(b,document.createTextNode(String(value??'')));return div};async function request(method,path,data){const r=await fetch(path,{method,headers:{'Authorization':'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{}) ,cache:'no-store'});const d=await r.json().catch(()=>({error:'Geçersiz sunucu yanıtı'}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function load(){token=$('token').value.trim();if(!token){$('msg').textContent='Anahtarı girin.';return}$('msg').textContent='Başvurular yükleniyor…';try{const d=await request('GET','/api/admin/applications'+($('filter').value?'?status='+encodeURIComponent($('filter').value):''));const root=$('applications');root.replaceChildren();const a=d.applications||[];$('msg').textContent=a.length+' başvuru listelendi.';if(!a.length){root.textContent='Bu filtrede başvuru yok.';return}for(const item of a){const card=document.createElement('div');card.className='card';for(const [label,key] of [['Numara','id'],['İşletme','name'],['Adres','district'],['İletişim','contact'],['Tür','kind'],['Kapasite','capacity'],['Ücret','fee'],['Açıklama','details'],['Talep','request_type'],['Tarih','created_at']])card.appendChild(field(label,item[key]));card.appendChild(field('Durum',labels[item.status]||item.status));for(const [status,label] of [['approved','Onayla'],['rejected','Reddet'],['pending','Beklemeye al']]){const btn=document.createElement('button');btn.textContent=label;btn.className=status==='approved'?'':'secondary';btn.disabled=item.status===status;btn.onclick=async()=>{if(!confirm('#'+item.id+' başvurusunun durumu '+label.toLowerCase()+' olarak değişsin mi?'))return;btn.disabled=true;try{await request('PATCH','/api/admin/applications',{id:item.id,status});await load()}catch(e){$('msg').textContent=e.message;btn.disabled=false}};card.appendChild(btn)}const del=document.createElement('button');del.className='danger';del.textContent='🗑️ Sil';del.onclick=async()=>{if(!confirm('#'+item.id+' - '+item.name+' başvurusunu kalıcı olarak silmek istediğine emin misin? Bu işlem geri alınamaz.'))return;if(!confirm('Son onay: #'+item.id+' başvurusu veritabanından kalıcı olarak silinecek. Devam edilsin mi?'))return;del.disabled=true;try{const result=await request('DELETE','/api/admin/applications',{id:item.id,confirm:'DELETE'});if(result.ok){await load();$('msg').textContent='#'+item.id+' başvurusu kalıcı olarak silindi.'}else throw Error('Silme doğrulanamadı')}catch(e){$('msg').textContent='Silme hatası: '+e.message;del.disabled=false}};card.appendChild(del);if(item.status==='approved'){const access=document.createElement('button');access.className='secondary';access.textContent='🔑 İşletmeci anahtarı oluştur';access.onclick=async()=>{if(!confirm('Bu işletme için yeni erişim anahtarı oluşturulsun mu? Önceki anahtar geçersiz olur.'))return;try{const r=await request('POST','/api/admin/issue-access',{id:item.id});const info=document.createElement('div');info.className='field';info.textContent='Yeni erişim anahtarı (yalnızca şimdi gösterilir): '+r.token;const copy=document.createElement('button');copy.textContent='Anahtarı kopyala';copy.onclick=()=>navigator.clipboard.writeText(r.token);info.appendChild(copy);card.appendChild(info);$('msg').textContent='Anahtarı güvenli şekilde işletmeciye iletin.'}catch(e){$('msg').textContent=e.message}};card.appendChild(access)}root.appendChild(card)}}catch(e){$('msg').textContent='Hata: '+e.message;$('applications').replaceChildren()}}$('load').onclick=load;$('filter').onchange=()=>{if(token)load()};$('logout').onclick=()=>{token='';$('token').value='';$('applications').textContent='Oturum temizlendi.';$('msg').textContent='Anahtar temizlendi.'}})();</script></body></html>
