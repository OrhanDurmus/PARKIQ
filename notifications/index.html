<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091421"><title>Bildirim Merkezi · ROTAPARK</title><style>*{box-sizing:border-box}body{margin:0;background:#091421;color:#eaf6fc;font:15px system-ui,-apple-system,sans-serif}header{padding:calc(15px + env(safe-area-inset-top)) 18px 18px;background:#132b3c;border-bottom:1px solid #365669;display:flex;align-items:center;gap:14px}header a{color:#73e4cc;text-decoration:none;font-weight:700}main{max-width:720px;margin:auto;padding:20px 16px 70px}h1{font-size:25px;margin:8px 0}.hint{color:#a9c3d0;line-height:1.5}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}button{background:#25465d;border:1px solid #476c7c;border-radius:11px;color:#efffff;font:700 13px system-ui;padding:11px 14px;cursor:pointer}.primary{background:#48cfb3;color:#0a2d30;border-color:#48cfb3}.item{border:1px solid #35586a;border-radius:16px;padding:15px;margin:11px 0;background:#142e3f}.item.unread{border-color:#55d9c1;background:#193b45}.head{display:flex;gap:12px;align-items:center}.symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#29545b;flex:0 0 42px;font-size:21px}.body{flex:1;min-width:0}.body strong{display:block;font-size:15px}.body small{display:block;color:#a9c3d0;margin-top:5px}.reply{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:14px 0 4px;color:#dcecf4}.dot{width:9px;height:9px;background:#53dfc0;border-radius:50%}.filters{display:flex;gap:8px;overflow-x:auto;margin:14px 0 18px}.filters button{flex:1;min-width:86px;white-space:nowrap}.filters button[aria-pressed="true"]{background:#4bd3b5;border-color:#4bd3b5;color:#092e30}.empty{border:1px dashed #3d5d70;border-radius:15px;padding:24px;text-align:center;color:#aec4d0}</style></head><body><header><a href="/">← ROTAPARK</a><strong>Bildirim Merkezi</strong></header><main><h1>🔔 Bildirimlerim</h1><p class="hint">Destek yanıtlarını ve güncel ROTAPARK sistem duyurularını tek yerden takip edin. Destek yanıtları bu tarayıcıdaki takip bilgilerine bağlıdır.</p><div class="tools"><button id="refresh" class="primary">↻ Yenile</button><button id="readAll">Tümünü okundu işaretle</button></div><div class="filters" role="group" aria-label="Bildirim türü"><button type="button" data-filter="all" aria-pressed="true">Tümü</button><button type="button" data-filter="support" aria-pressed="false">✉️ Destek</button><button type="button" data-filter="system" aria-pressed="false">📢 Sistem</button><button type="button" data-filter="archive" aria-pressed="false">🗂️ Arşiv</button></div><p id="status" class="hint" role="status">Bildirimler kontrol ediliyor…</p><div id="items"></div></main><script>(function(){
const KEY='rotapark-support-tickets',SEEN='rotapark-support-replies-seen',ANNOUNCE_SEEN='rotapark-announcement-notification-seen',ARCHIVE='rotapark-notification-archive';
let current=[],announcement=null,filter='all',loading=false;
const $=id=>document.getElementById(id),read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||f)}catch{return JSON.parse(f)}};
const archive=()=>read(ARCHIVE,'{}'),store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function mark(id,time){const m=read(SEEN,'{}');m[id]=time;store(SEEN,m)}
function entries(){const seen=read(SEEN,'{}'),list=current.map(({t,d})=>({id:'support:'+t.requestId+':'+d.repliedAt,type:'support',title:t.type==='blocked'?'Hesap itirazınız yanıtlandı':'Destek talebiniz yanıtlandı',message:d.reply,time:Number(d.repliedAt)||0,unread:Number(seen[t.requestId]||0)<Number(d.repliedAt),mark:()=>mark(t.requestId,d.repliedAt)}));if(announcement)list.push({id:'system:'+announcement.id,type:'system',title:'ROTAPARK sistem duyurusu',message:announcement.message,time:Number(announcement.createdAt||announcement.startsAt||0),unread:localStorage.getItem(ANNOUNCE_SEEN)!==String(announcement.id),mark:()=>localStorage.setItem(ANNOUNCE_SEEN,String(announcement.id))});return list}
function render(){document.querySelectorAll('[data-filter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.filter===filter)));const box=$('items');box.replaceChildren();const all=entries(),archived=archive(),unread=all.filter(x=>x.unread&&!archived[x.id]).length;let list=all.filter(x=>filter==='archive'?!!archived[x.id]:!archived[x.id]&&(filter==='all'||filter===x.type));list.sort((a,b)=>Number(b.unread)-Number(a.unread)||b.time-a.time);$('status').textContent=all.length+' bildirim · '+unread+' okunmamış · '+all.filter(x=>archived[x.id]).length+' arşivde';if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=filter==='archive'?'Arşiviniz boş.':'Bu bölümde bildirim yok.';box.append(e);return}for(const item of list){const el=document.createElement('article');el.className='item'+(item.unread&&!archived[item.id]?' unread':'');const head=document.createElement('div');head.className='head';const sym=document.createElement('span');sym.className='symbol';sym.textContent=item.type==='system'?'📢':'✉️';const body=document.createElement('div');body.className='body';const title=document.createElement('strong');title.textContent=item.title;const date=document.createElement('small');date.textContent=item.time?new Date(item.time).toLocaleString('tr-TR'):item.type==='system'?'Aktif duyuru':'';body.append(title,date);head.append(sym,body);if(item.unread&&!archived[item.id]){const dot=document.createElement('span');dot.className='dot';head.append(dot)}const msg=document.createElement('p');msg.className='reply';msg.textContent=item.message;const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap';if(item.unread){const seenBtn=document.createElement('button');seenBtn.textContent='✓ Okundu işaretle';seenBtn.onclick=()=>{item.mark();render()};actions.append(seenBtn)}const move=document.createElement('button');move.textContent=archived[item.id]?'↩ Arşivden çıkar':'🗂️ Arşivle';move.onclick=()=>{const m=archive();if(m[item.id])delete m[item.id];else{m[item.id]=Date.now();item.mark()}store(ARCHIVE,m);render()};actions.append(move);el.append(head,msg,actions);box.append(el)}}
async function load(){if(loading)return;loading=true;$('status').textContent='Bildirimler kontrol ediliyor…';try{let tickets=read(KEY,'[]');if(!Array.isArray(tickets))tickets=[];current=[];announcement=null;try{const ar=await fetch('/api/flash-message',{cache:'no-store'});if(ar.ok){const data=await ar.json();if(data.message&&data.message.id&&data.message.expiresAt>Date.now())announcement=data.message}}catch{}for(const t of tickets.slice(0,40)){if(!t.requestId||!t.accessToken)continue;try{const r=await fetch('/api/support-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:t.requestId,accessToken:t.accessToken}),cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(d.ok&&d.reply&&d.repliedAt)current.push({t,d})}catch{}}render()}finally{loading=false}}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;render()});$('refresh').onclick=load;$('readAll').onclick=()=>{for(const item of entries())item.mark();render()};load();
})();</script></body></html>
