<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091421"><title>Bildirim Merkezi · ROTAPARK</title><style>*{box-sizing:border-box}body{margin:0;background:#091421;color:#eaf6fc;font:15px system-ui,-apple-system,sans-serif}header{padding:calc(15px + env(safe-area-inset-top)) 18px 18px;background:#132b3c;border-bottom:1px solid #365669;display:flex;align-items:center;gap:14px}header a{color:#73e4cc;text-decoration:none;font-weight:700}main{max-width:720px;margin:auto;padding:20px 16px 70px}h1{font-size:25px;margin:8px 0}.hint{color:#a9c3d0;line-height:1.5}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}button{background:#25465d;border:1px solid #476c7c;border-radius:11px;color:#efffff;font:700 13px system-ui;padding:11px 14px;cursor:pointer}.primary{background:#48cfb3;color:#0a2d30;border-color:#48cfb3}.item{border:1px solid #35586a;border-radius:16px;padding:15px;margin:11px 0;background:#142e3f}.item.unread{border-color:#55d9c1;background:#193b45}.head{display:flex;gap:12px;align-items:center}.symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#29545b;flex:0 0 42px;font-size:21px}.body{flex:1;min-width:0}.body strong{display:block;font-size:15px}.body small{display:block;color:#a9c3d0;margin-top:5px}.reply{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:14px 0 4px;color:#dcecf4}.dot{width:9px;height:9px;background:#53dfc0;border-radius:50%}.empty{border:1px dashed #3d5d70;border-radius:15px;padding:24px;text-align:center;color:#aec4d0}</style></head><body><header><a href="/">← ROTAPARK</a><strong>Bildirim Merkezi</strong></header><main><h1>🔔 Bildirimlerim</h1><p class="hint">Destek taleplerinize gelen yanıtları burada görüntüleyebilir ve okundu olarak işaretleyebilirsiniz. Bildirimler bu tarayıcıdaki takip bilgilerine bağlıdır.</p><div class="tools"><button id="refresh" class="primary">↻ Yenile</button><button id="readAll">Tümünü okundu işaretle</button></div><p id="status" class="hint" role="status">Bildirimler kontrol ediliyor…</p><div id="items"></div></main><script>(function(){const KEY='rotapark-support-tickets',SEEN='rotapark-support-replies-seen';let current=[];const $=id=>document.getElementById(id);const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||f)}catch{return JSON.parse(f)}};function mark(id,time){const m=read(SEEN,'{}');m[id]=time;try{localStorage.setItem(SEEN,JSON.stringify(m))}catch{}}function render(){const box=$('items');box.replaceChildren();const seen=read(SEEN,'{}');const unread=current.filter(x=>Number(seen[x.t.requestId]||0)<Number(x.d.repliedAt)).length;$('status').textContent=current.length+' destek yanıtı · '+unread+' okunmamış';if(!current.length){const e=document.createElement('div');e.className='empty';e.textContent='Henüz destek yanıtı bildirimi yok.';box.append(e);return}for(const {t,d} of current){const isUnread=Number(seen[t.requestId]||0)<Number(d.repliedAt);const el=document.createElement('article');el.className='item'+(isUnread?' unread':'');const head=document.createElement('div');head.className='head';const sym=document.createElement('span');sym.className='symbol';sym.textContent='✉️';const body=document.createElement('div');body.className='body';const title=document.createElement('strong');title.textContent=t.type==='blocked'?'Hesap itirazınız yanıtlandı':'Destek talebiniz yanıtlandı';const date=document.createElement('small');date.textContent=new Date(d.repliedAt).toLocaleString('tr-TR');body.append(title,date);head.append(sym,body);if(isUnread){const dot=document.createElement('span');dot.className='dot';head.append(dot)}const reply=document.createElement('p');reply.className='reply';reply.textContent=d.reply;const button=document.createElement('button');button.textContent=isUnread?'✓ Okundu işaretle':'Okundu';button.disabled=!isUnread;button.onclick=()=>{mark(t.requestId,d.repliedAt);render()};el.append(head,reply,button);box.append(el)}}async function load(){const box=$('items');$('status').textContent='Bildirimler kontrol ediliyor…';let tickets=read(KEY,'[]');if(!Array.isArray(tickets))tickets=[];current=[];for(const t of tickets.slice(0,40)){if(!t.requestId||!t.accessToken)continue;try{const r=await fetch('/api/support-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:t.requestId,accessToken:t.accessToken}),cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(d.ok&&d.reply&&d.repliedAt)current.push({t,d})}catch{}}current.sort((a,b)=>Number(b.d.repliedAt)-Number(a.d.repliedAt));render()}$('refresh').onclick=load;$('readAll').onclick=()=>{for(const {t,d} of current)mark(t.requestId,d.repliedAt);render()};load()})();</script></body></html>
