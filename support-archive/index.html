<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091421"><title>Destek Arşivim · ROTAPARK</title><style>*{box-sizing:border-box}body{margin:0;background:#091421;color:#eaf5fa;font:15px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;background:#102638;border-bottom:1px solid #345768}a{color:#62e0c4;text-decoration:none}header a{padding:10px;border-radius:10px;background:#244353}main{max-width:720px;margin:auto;padding:22px 16px 90px}h1{font-size:25px;margin:8px 0 10px}.hint{color:#a9c4d0;line-height:1.5}.item{border:1px solid #385f6f;border-radius:15px;background:#152e40;margin:13px 0;padding:16px;overflow-wrap:anywhere}.item p{white-space:pre-wrap;line-height:1.6}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#24524d;color:#75efcf;font-size:12px;font-weight:700}button{border:0;border-radius:12px;padding:12px 18px;background:#4bd3b5;color:#092b30;font-weight:750;font-size:14px}#loading{margin:20px 0}</style></head><body><header><a href="/">← ROTAPARK</a><strong>🗂️ Destek Merkezi</strong></header><main><h1>Destek arşivim</h1><p class="hint">Yanıtlanan ve kapatılan destek talepleriniz burada görüntülenir. Yalnızca bu tarayıcıda takip bilgisi bulunan talepler listelenir.</p><button id="refresh" type="button">↻ Arşivi yenile</button><p id="loading" role="status"></p><div id="items"></div></main><script>(function(){async function load(){const box=document.getElementById('items'),status=document.getElementById('loading');box.replaceChildren();status.textContent='Talepler kontrol ediliyor…';let tickets=[];try{tickets=JSON.parse(localStorage.getItem('rotapark-support-tickets')||'[]')}catch{}if(!Array.isArray(tickets)||!tickets.length){status.textContent='Bu tarayıcıda takip edilen destek talebi bulunmuyor.';return}let count=0;for(const t of tickets){if(!t.requestId||!t.accessToken)continue;try{const r=await fetch('/api/support-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:t.requestId,accessToken:t.accessToken}),cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(!d.ok||(!d.reply&&d.status!=='closed'))continue;const el=document.createElement('article');el.className='item';const title=document.createElement('strong');title.textContent=(t.type==='blocked'?'Hesap itirazı':'Destek talebi')+' · '+new Date(d.createdAt).toLocaleDateString('tr-TR');const badge=document.createElement('div');badge.style.marginTop='10px';badge.className='tag';badge.textContent=d.status==='closed'?'Kapatıldı':'Yanıtlandı';const msg=document.createElement('p');msg.textContent=d.reply||'Talep kapatıldı.';el.append(title,badge,msg);box.append(el);count++;if(d.reply&&d.repliedAt){try{const key='rotapark-support-replies-seen',seen=JSON.parse(localStorage.getItem(key)||'{}');seen[t.requestId]=d.repliedAt;localStorage.setItem(key,JSON.stringify(seen))}catch{}}}catch{}}status.textContent=count?count+' arşiv kaydı bulundu.':'Yanıtlanmış veya kapatılmış talep bulunmuyor.'}document.getElementById('refresh').onclick=load;load()})();</script></body></html>
