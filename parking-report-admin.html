<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROTAPARK · Otopark Bildirim Yönetimi</title><style>body{margin:0;background:#101d2a;color:#eaf1f7;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{font-size:24px}button,select,input{font:inherit;padding:11px;border-radius:9px;border:1px solid #60758a}button{background:#d94040;color:white;cursor:pointer}button:disabled{opacity:.55}[hidden]{display:none!important}input{background:#1d3041;color:white;width:min(100%,420px)}select{background:#1d3041;color:white}article{border:1px solid #3a5367;border-radius:12px;padding:16px;margin:12px 0;background:#192a39}small{color:#afc3d2}p{overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#395b71}a{color:#9ed8ff}</style></head><body><main><h1>ROTAPARK · Otopark bildirimleri</h1><p>Yalnızca yetkili yönetici hesapları erişebilir. Onay, kaydı otomatik olarak yayından kaldırmaz.</p><p id="state" role="status">Oturum bekleniyor.</p><div id="auth"><label>Yönetici e-postası <input id="email" type="email" autocomplete="username"></label><p><label>6 haneli doğrulama kodu <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="E-postana gelen kod"></label></p><button id="login">Kod gönder</button> <button id="verify" class="secondary">Kodla giriş yap</button> </div><button id="logout" class="secondary" hidden>Çıkış yap</button><p><select id="filter" aria-label="Bildirim durumu"><option value="pending">Bekleyen</option><option value="approved">Onaylanan</option><option value="rejected">Reddedilen</option></select> <button id="reload" class="secondary">Yenile</button></p><div id="reports"></div><p><a href="/">ROTAPARK'a dön</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id),state=$('state'),reports=$('reports');let client,loadVersion=0;function showAuth(signedIn){$('auth').hidden=signedIn;$('otp').value='';if(signedIn)$('email').value='';$('logout').hidden=!signedIn;}
async function init(){try{const r=await fetch('/api/auth-config',{cache:'no-store'});const config=await r.json();const url=config.supabaseUrl||config.url||config.SUPABASE_URL;const key=config.supabaseAnonKey||config.anonKey||config.SUPABASE_ANON_KEY;if(!url||!key)throw Error('Supabase yapılandırması alınamadı.');client=createClient(url,key,{auth:{flowType:'pkce',detectSessionInUrl:false}});state.textContent='Giriş yaparak bildirimleri görüntüleyebilirsin.';await load()}catch(e){state.textContent=e.message}}
async function token(){if(!client)return null;const {data:{session}}=await client.auth.getSession();return session?.access_token||null}
async function load(){const version=++loadVersion;reports.replaceChildren();const access=await token();if(version!==loadVersion)return;if(!access){showAuth(false);state.textContent='Yönetici hesabıyla giriş yap.';return}showAuth(true);state.textContent='Bildirimler yükleniyor…';try{const res=await fetch('/api/admin/parking-accuracy-reports?status='+encodeURIComponent($('filter').value),{headers:{Authorization:'Bearer '+access},cache:'no-store'});const data=await res.json();if(version!==loadVersion)return;if(!res.ok)throw Error(data.error||'Bildirimler alınamadı.');reports.replaceChildren();const unique=[...new Map((data.reports||[]).map(item=>[item.id,item])).values()];state.textContent=unique.length+' bildirim';for(const item of unique){const card=document.createElement('article');const heading=document.createElement('h2');heading.textContent=(item.name||'İsimsiz otopark')+' · #'+item.id;const info=document.createElement('p');info.textContent='Sebep: '+item.reason+' · OSM '+item.osm_type+'/'+item.osm_id+' · '+item.created_at;const note=document.createElement('p');note.textContent=item.note||'Açıklama yok';const map=document.createElement('a');map.href='https://www.openstreetmap.org/'+item.osm_type+'/'+item.osm_id;map.target='_blank';map.rel='noopener noreferrer';map.textContent='OpenStreetMap kaydını incele';card.append(heading,info,note,map);if(item.status==='pending'){const actions=document.createElement('div');actions.className='actions';const reasonSelect=document.createElement('select');reasonSelect.setAttribute('aria-label','Bildirim gerekçesi');for(const [value,label] of [['not_parking','Otopark değil'],['not_public','Özel / halka açık değil'],['wrong_location','Yanlış konum'],['closed','Kapalı'],['other','Diğer']]){const option=document.createElement('option');option.value=value;option.textContent=label;reasonSelect.append(option)}reasonSelect.value=item.reason;actions.append(reasonSelect);for(const [status,label,cls] of [['approved','İncelendi · Onayla',''],['rejected','Reddet','secondary']]){const btn=document.createElement('button');btn.textContent=label;btn.className=cls;btn.onclick=async()=>{if(!confirm('Bu bildirimi '+(status==='approved'?'onaylamak':'reddetmek')+' istiyor musun?'))return;btn.disabled=true;try{const response=await fetch('/api/admin/parking-accuracy-reports',{method:'PATCH',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({id:item.id,status,reason:reasonSelect.value})});const result=await response.json();if(!response.ok)throw Error(result.error||'İşlem başarısız');await load()}catch(e){state.textContent=e.message;btn.disabled=false}};actions.append(btn)}card.append(actions)}reports.append(card)}}catch(e){if(version===loadVersion)state.textContent=e.message}}
$('login').onclick=async()=>{if(!client)return;const email=$('email').value.trim();if(!email){state.textContent='E-posta adresini yaz.';return}const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});state.textContent=error?error.message:'Doğrulama kodu e-postana gönderildi.'};$('verify').onclick=async()=>{if(!client)return;const email=$('email').value.trim(),code=$('otp').value.trim();if(!email||!/^\d{6,8}$/.test(code)){state.textContent='E-posta adresini ve doğrulama kodunu gir.';return}const {error}=await client.auth.verifyOtp({email,token:code,type:'email'});if(error){state.textContent=error.message;return}await load()};$('logout').onclick=async()=>{if(client)await client.auth.signOut();loadVersion++;reports.replaceChildren();showAuth(false);state.textContent='Çıkış yapıldı.'};$('reload').onclick=load;$('filter').onchange=load;init();
</script></body></html>
